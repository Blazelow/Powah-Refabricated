plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'java-library'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.blamejared.com/' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/powah.accesswidener')
    runs {
        client {
            client()
            ideConfigGenerated true
            runDir 'run'
        }
        server {
            server()
            ideConfigGenerated true
            runDir 'run-server'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    api "teamreborn:energy:${project.team_reborn_energy_version}"
    include "teamreborn:energy:${project.team_reborn_energy_version}"

    api "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}", {
        exclude group: 'net.fabricmc.fabric-api'
    }

    compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    compileOnly "maven.modrinth:trinkets-updated:${project.trinkets_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
