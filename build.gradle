plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'java-library'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    mavenCentral()
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/powah.accesswidener')
    runs {
        client {
            client()
            ideConfigGenerated true
            runDir 'run'
        }
        server {
            server()
            ideConfigGenerated true
            runDir 'run-server'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modApi "teamreborn:energy:${project.team_reborn_energy_version}"
    include "teamreborn:energy:${project.team_reborn_energy_version}"

    modApi "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}", {
        exclude group: 'net.fabricmc.fabric-api'
    }

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"
    modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
