name: Publish

run-name: "Powah! Refabricated ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Read version
        run: echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Publish Fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Powah-Refabricated-fabric-26.2-${{ env.MOD_VERSION }}.jar
          changelog-file: CHANGELOG.md
          version-type: release
          loaders: fabric
          game-versions: 26.2
          java: 25
          dependencies: |
            fabric-api(required)
            cloth-config(required)
